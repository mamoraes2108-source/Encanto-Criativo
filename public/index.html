<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Encanto Criativo • Gestão</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside>
      <a class="brand" href="#painel"
        ><span class="flower" aria-hidden="true"
          ><svg viewBox="0 0 64 54" width="54" height="46">
            <path
              d="M27 2C29 20 33 23 50 26C33 29 29 33 27 51C24 33 21 29 4 26C21 23 24 20 27 2Z"
              fill="currentColor"
            />
            <path
              d="M51 0C52 7 54 9 61 10C54 11 52 13 51 20C50 13 48 11 41 10C48 9 50 7 51 0Z"
              fill="currentColor"
            /></svg
        ></span>
        encanto<small>CRIATIVO</small></a
      >
      <div class="nav-label">SEU ATELIÊ, ORGANIZADO</div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        Feito para criar<br /><em>com mais tranquilidade.</em>
        <p>✧ Gestão do ateliê · v3.0</p>
      </div>
    </aside>
    <main>
      <header>
        <div>
          <small
            >ENCANTO CRIATIVO / <span id="breadcrumb">VISÃO GERAL</span></small
          >
          <h1 id="title">Um olhar para o seu negócio</h1>
          <p id="subtitle">Cada detalhe organizado. Mais espaço para criar.</p>
        </div>
        <span class="avatar">EC</span>
      </header>
      <div id="notice" role="status"></div>
      <section id="content"></section>
      <footer>
        Encanto Criativo <span>Gestão com carinho, decisões com clareza.</span>
      </footer>
    </main>
    <dialog id="modal">
      <div id="modal-content"></div>
      <button
        class="close"
        aria-label="Fechar janela"
        onclick="document.querySelector('#modal').close()"
      >
        ×
      </button>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
